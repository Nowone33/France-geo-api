services:
  postgres:
    image: postgres:17-alpine
    container_name: france-geo-postgres
    ports:
      - "5434:5434"
    environment:
      - POSTGRES_DB=france_geo_sql
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
        - postgres_data:/var/lib/postgresql/data
  mongodb:
    image: mongo:latest
    container_name: france-geo-mongo
    ports:
      - "27018:27017"  # windows: container
    environment:
      - MONGO_INITDB_DATABASE=france_db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: france-geo-rabbit
    ports:
      - "5673:5672"   # Port de communication AMQP
      - "15673:15672" # Port de l'interface de gestion (UI)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  redis:
    image: redis:7-alpine
    container_name: france-geo-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
  postgres_data: